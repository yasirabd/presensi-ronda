services:
  - type: web
    name: ronda-pak
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      # The Docker build maps these existing Render values to Expo public variables.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FACE_SIGNING_KEY
        sync: false
      - key: FACE_TEMPLATE_KEY
        sync: false
