services:
  - type: web
    name: ronda-pak
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FACE_SIGNING_KEY
        sync: false
      - key: FACE_TEMPLATE_KEY
        sync: false
